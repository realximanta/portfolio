<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e12">
  <title>Page not found | Tuku / Ximanta</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f0f5f6; background: #0b0e12; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(ellipse at top, #172a28, transparent 65%); }
    main { width: min(100%, 36rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #35454a; border-radius: 1.25rem; background: #141a21; }
    .label { color: #75d6ac; font: 600 .875rem ui-monospace, monospace; }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.1; margin: 1rem 0; letter-spacing: -.04em; }
    .message { color: #b0bec6; line-height: 1.65; margin-bottom: 1.75rem; }
    nav { display: flex; gap: .75rem; flex-wrap: wrap; }
    a { display: inline-block; padding: .75rem 1rem; border: 1px solid #435460; border-radius: .625rem; color: inherit; text-decoration: none; font-weight: 600; }
    a:first-child { background: #75d6ac; color: #0b1612; border-color: #75d6ac; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #75d6ac; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="label">TUKU.EXE / ERROR 404</p>
    <h1>Page not found.</h1>
    <p class="message">This link may be out of date, or the address may have a typo. You can head back home or jump straight to my projects.</p>
    <nav aria-label="Where to go next">
      <a href="/">Back to home</a>
      <a href="/#projects">Browse projects</a>
    </nav>
  </main>
</body>
</html>
